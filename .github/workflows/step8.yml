name: step8-fundamentals

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N stocks (blank = all)"
        required: false
        default: ""
      parts:
        description: "all / yf-only / nse-only"
        required: false
        default: "all"

permissions:
  contents: write

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Load fundamentals and measure coverage
        run: |
          ARGS=""
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          [ "${{ inputs.parts }}" = "yf-only" ] && ARGS="$ARGS --skip-nse"
          [ "${{ inputs.parts }}" = "nse-only" ] && ARGS="$ARGS --skip-yf"
          python scripts/step8_fundamentals.py $ARGS
      - name: Save data to the repo
        if: always()
        run: |
          git config user.name "backfill-bot"
          git config user.email "backfill-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Step 8 fundamentals $(date -u +%F)"
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step8-coverage
          path: step8_coverage.xlsx
